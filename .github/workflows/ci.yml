name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  actions: read
  contents: read
  pull-requests: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: 1
  NX_DAEMON: false

jobs:
  verify:
    name: verify (all gates)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          # Full history: the commit-messages stage lints merge-base..HEAD and the
          # test-weakening stage diffs against the base branch; a shallow clone breaks both.
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - run: pnpm exec playwright install --with-deps chromium

      - name: Derive SHAs for affected commands
        uses: nrwl/nx-set-shas@v4

      # The single definition of done. Same script the agent hooks and git hooks run.
      - name: pnpm verify:all
        run: pnpm verify:all

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: dist/.playwright/apps/shell-e2e
          retention-days: 14

  mutation:
    name: mutation testing (changed pure logic)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    needs: verify
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Restore incremental mutation report
        uses: actions/cache@v4
        with:
          path: reports/stryker-incremental.json
          key: stryker-${{ github.base_ref }}-${{ github.sha }}
          restore-keys: stryker-${{ github.base_ref }}-
      - name: Run Stryker if any type:data / type:util sources exist
        run: |
          if ls packages/*/data*/src/**/*.ts packages/*/util*/src/**/*.ts 2>/dev/null | grep -v spec >/dev/null; then
            pnpm exec stryker run --incremental
          else
            echo "No pure-logic libraries yet; skipping mutation testing."
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mutation-report
          path: reports/mutation
          retention-days: 14
